[project]
name = "vacation-agent"
version = "0.1.0"
description = "AI vacation planning assistant: multi-agent LangGraph workflow with tools, HITL, RAG and long-term memory."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "langchain-core>=0.3",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "langchain-google-genai>=2.1",
    "langchain-chroma>=0.2",
    "chromadb>=0.5",
    "langchain-text-splitters>=0.3",
    "sentence-transformers==5.1.2",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

# CPU-only PyTorch (sentence-transformers runs on CPU; avoids multi-GB CUDA wheels in Docker)
[[tool.pdm.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
include_packages = ["torch"]
exclude_packages = ["*"]

[tool.pdm.scripts]
serve = "uvicorn vacation_agent.api.app:app --host 0.0.0.0 --port 8000 --reload"
start = "uvicorn vacation_agent.api.app:app --host 0.0.0.0 --port 8000"
test = "pytest"
lint = "ruff check src tests"
fmt = "ruff format src tests"
ingest = "python -m vacation_agent.rag.ingest"
fetch-corpus = "python -m vacation_agent.rag.fetch"
refresh-corpus = "python -m vacation_agent.rag.refresh"
graph = "python -m vacation_agent.graph.orchestrator"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
